name: Publish Docker image

on:
  push:
    branches: [main, feature/use-docker-commands]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOOTSTRAP_COLOR_PRIMARY=${{ vars.BOOTSTRAP_COLOR_PRIMARY }}
            BOOTSTRAP_COLOR_SECONDARY=${{ vars.BOOTSTRAP_COLOR_SECONDARY }}
            BOOTSTRAP_COLOR_TERTIARY=${{ vars.BOOTSTRAP_COLOR_TERTIARY }}
            BOOTSTRAP_COLOR_SUCCESS=${{ vars.BOOTSTRAP_COLOR_SUCCESS }}
            BOOTSTRAP_COLOR_WARNING=${{ vars.BOOTSTRAP_COLOR_WARNING }}
            BOOTSTRAP_COLOR_DANGER=${{ vars.BOOTSTRAP_COLOR_DANGER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
